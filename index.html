<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electrónica I - Ejercicios Guiados Paso a Paso</title>
  
  <script>
    // Inmediatamente aplicar el tema guardado para evitar flash
    (function() {
      try {
        const saved = localStorage.getItem('qbik-theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <!-- KaTeX para renderizado de fórmulas matemáticas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Estilos propios -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col selection:bg-blue-600 selection:text-white transition-colors duration-150">

  <!-- Barra de navegación superior limpia y espaciosa -->
  <header class="border-b border-slate-200 dark:border-slate-800/80 sticky top-0 z-30 bg-white/95 dark:bg-slate-950/95 backdrop-blur-sm transition-colors">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <!-- Logo Qbik -->
        <a 
          href="https://qbik.com.ar" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="flex items-center hover:opacity-85 transition-opacity shrink-0" 
          title="Qbik (qbik.com.ar)"
        >
          <img id="header-logo-img" src="logo-hz-dark.png" alt="Qbik" class="h-7 sm:h-8 w-auto">
        </a>

        <!-- Botón Volver a todas las materias -->
        <div id="header-btn-volver-materias" class="hidden items-center gap-1.5 shrink-0 text-xs font-mono">
          <span class="text-slate-300 dark:text-slate-700">/</span>
          <button 
            onclick="volverAMaterias()" 
            title="Volver a la selección de materias"
            class="text-slate-600 hover:text-slate-950 dark:text-slate-400 dark:hover:text-white transition-colors flex items-center gap-1 font-medium"
          >
            <span>←</span>
            <span>Materias</span>
          </button>
        </div>

        <!-- Info de la materia activa -->
        <div id="header-info-materia" class="hidden items-center gap-1.5 min-w-0 text-xs font-mono">
          <span class="text-slate-300 dark:text-slate-700">/</span>
          <span id="materia-icono-box" class="text-slate-400 select-none hidden">⚡</span>
          <h1 id="materia-nombre-header" class="text-slate-900 dark:text-slate-200 truncate font-semibold">
            Electrónica I
          </h1>
          <span id="materia-badge-revision" class="hidden px-1.5 py-0.5 rounded text-[10px] bg-amber-500/15 text-amber-600 dark:text-amber-400 border border-amber-500/30 font-sans font-medium shrink-0">En revisión</span>
          <span id="materia-badge" class="hidden"></span>
          <p id="materia-subtitulo" class="hidden"></p>
        </div>

        <!-- Tagline visible solo en el portal -->
        <div id="header-portal-tagline" class="hidden sm:flex items-center text-xs text-slate-500 font-mono">
          <span class="text-slate-300 dark:text-slate-700 mx-2">/</span>
          <span>Cátedra Interactiva</span>
        </div>
      </div>

      <!-- Barra de progreso y acciones (lado derecho) -->
      <div class="flex items-center gap-2.5 sm:gap-3 shrink-0 text-xs font-mono">
        <div id="header-stats-container" class="hidden sm:flex items-center gap-1.5 text-slate-600 dark:text-slate-400">
          <span id="stats-ejercicios">0/0 ej.</span>
          <span class="text-slate-300 dark:text-slate-600">·</span>
          <span id="stats-porcentaje" class="text-slate-900 dark:text-slate-300 font-bold">0%</span>
          <div class="hidden"><div id="stats-barra-progreso"></div></div>
        </div>

        <!-- Botón Modo Claro / Oscuro -->
        <button 
          id="btn-theme-toggle" 
          onclick="toggleTheme()" 
          title="Cambiar a modo claro u oscuro"
          class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 hover:text-amber-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-amber-300 dark:hover:bg-slate-900 transition-colors flex items-center justify-center text-sm"
          aria-label="Cambiar tema claro u oscuro"
        >
          <span id="theme-toggle-icon">☀️</span>
        </button>

        <!-- Botón Reiniciar Avance -->
        <button 
          id="btn-reiniciar-progreso" 
          title="Reiniciar avance de ejercicios"
          class="text-slate-400 hover:text-rose-600 dark:text-slate-500 dark:hover:text-rose-400 transition-colors hidden"
        >
          Reiniciar
        </button>
      </div>
    </div>
  </header>

  <!-- VISTA 1: PORTAL DE SELECCIÓN DE MATERIAS (RECUADROS MINIMALISTAS) -->
  <section id="vista-seleccion-materias" class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full animate-fade-in">
    <div class="mb-6">
      <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight">
        Asignaturas
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
        Selecciona una materia para resolver problemas paso a paso.
      </p>
    </div>

    <!-- Grilla de recuadros de materias -->
    <div id="grid-materias-cards" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <!-- Se inyecta dinámicamente con app.js -->
    </div>
  </section>

  <!-- VISTA 2: ENTORNO DE RESOLUCIÓN DE LA MATERIA SELECCIONADA -->
  <div id="vista-materia-ejercicios" class="hidden flex-1 flex flex-col w-full animate-fade-in">
    <!-- Contenedor principal de ejercicios centrado en modo enfoque -->
    <main class="max-w-3xl mx-auto px-4 py-5 flex-1 w-full">
      <!-- Barra de navegación rápida de ejercicios (Sutil y sin cajas) -->
      <div class="mb-5 flex items-center justify-between gap-3 text-xs font-mono border-b border-slate-200 dark:border-slate-800/80 pb-3">
        <button 
          onclick="toggleListaEjerciciosMovil()"
          class="flex items-center gap-2 text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors truncate text-left"
          title="Ver índice de ejercicios"
        >
          <span class="text-slate-400 dark:text-slate-500 text-sm">☰</span>
          <span id="label-ejercicio-movil" class="truncate font-medium text-slate-800 dark:text-slate-200">Ver ejercicios</span>
          <span id="icono-desplegable-movil" class="text-slate-400 dark:text-slate-500 text-[10px]">▾</span>
        </button>

        <div class="flex items-center gap-1.5 shrink-0 text-slate-500 dark:text-slate-400">
          <button 
            onclick="navegarEjercicioRelativo(-1)" 
            title="Ejercicio anterior" 
            class="px-2 py-1 hover:text-slate-900 hover:bg-slate-200 dark:hover:text-white dark:hover:bg-slate-900 rounded transition-colors"
          >
            ◀ Ant
          </button>
          <span class="text-slate-300 dark:text-slate-800">|</span>
          <button 
            onclick="navegarEjercicioRelativo(1)" 
            title="Ejercicio siguiente" 
            class="px-2 py-1 hover:text-slate-900 hover:bg-slate-200 dark:hover:text-white dark:hover:bg-slate-900 rounded transition-colors"
          >
            Sig ▶
          </button>
        </div>
      </div>

      <!-- Backdrop oscuro para cerrar el cajón -->
      <div 
        id="backdrop-lista-ejercicios" 
        onclick="toggleListaEjerciciosMovil(false)" 
        class="hidden fixed inset-0 bg-slate-900/40 dark:bg-slate-950/80 z-40 transition-opacity"
      ></div>

      <!-- Drawer lateral deslizable con el índice y filtros (se abre a demanda) -->
      <aside 
        id="columna-lista-ejercicios" 
        class="hidden fixed inset-y-0 left-0 z-50 w-full sm:w-[360px] bg-white dark:bg-slate-950 border-r border-slate-200 dark:border-slate-800 p-4 overflow-y-auto flex flex-col shadow-2xl animate-slide-in-left"
      >
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200 dark:border-slate-800 shrink-0">
          <div class="flex items-center gap-2 min-w-0">
            <span class="font-semibold text-xs text-slate-900 dark:text-white uppercase tracking-wider font-mono">Índice</span>
            <span id="unidad-filtro-badge" class="text-[11px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 font-mono truncate">Unidad 1</span>
          </div>
          <!-- Botón cerrar cajón -->
          <button 
            onclick="toggleListaEjerciciosMovil(false)" 
            class="px-2 py-1 rounded text-slate-500 hover:text-slate-900 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-900 text-xs font-mono transition-colors shrink-0"
            title="Cerrar lista"
          >
            ✕ Cerrar
          </button>
        </div>

        <!-- Filtro de unidades integrado adentro del cajón -->
        <div class="mb-3 shrink-0">
          <div id="contenedor-filtros-unidades" class="flex flex-wrap gap-1 pb-1">
            <!-- Renderizado dinámico según la materia activa -->
          </div>
        </div>

        <!-- Buscador rápido dentro del cajón -->
        <div class="mb-3 relative shrink-0">
          <input 
            type="text" 
            id="busqueda-ejercicios" 
            placeholder="Buscar por tema o título..." 
            class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 focus:border-blue-500 dark:focus:border-slate-600 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-900 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none transition-colors"
            oninput="filtrarPorTexto(this.value)"
          />
          <svg class="w-3.5 h-3.5 text-slate-400 dark:text-slate-500 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <!-- Lista scrollable de tarjetas de ejercicios -->
        <div id="lista-ejercicios" class="flex-1 overflow-y-auto pr-1 space-y-1">
          <!-- Se inyecta dinámicamente con app.js -->
        </div>
      </aside>

      <!-- Espacio centrado de resolución del ejercicio -->
      <section class="w-full" id="vista-ejercicio">
        <!-- Se inyecta dinámicamente con app.js -->
      </section>
    </main>
  </div>

  <!-- Pie de página limpio y proporcionado con logo -->
  <footer class="border-t border-slate-200 dark:border-slate-800/80 py-5 sm:py-6 mt-auto text-xs font-mono text-slate-500 bg-white dark:bg-slate-950 transition-colors">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="https://qbik.com.ar" target="_blank" rel="noopener noreferrer" class="hover:opacity-85 transition-opacity" title="Qbik (qbik.com.ar)">
          <img id="footer-logo-img" src="logo-hz-dark.png" alt="Qbik" class="h-6 sm:h-7 w-auto">
        </a>
        <span class="text-slate-300 dark:text-slate-700 hidden sm:inline">|</span>
        <span class="text-slate-600 dark:text-slate-400">Cátedra Interactiva de Ingeniería</span>
      </div>
      <div>
        <a href="https://qbik.com.ar" target="_blank" rel="noopener noreferrer" class="text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition-colors">
          qbik.com.ar
        </a>
      </div>
    </div>
  </footer>

  <!-- Modal de felicitaciones al completar todos los pasos de un ejercicio -->
  <div id="modal-felicitaciones" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden animate-fade-in">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
      <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-2xl border border-emerald-200 dark:border-emerald-800/80">
        🎉
      </div>
      <h3 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white mb-1">
        ¡Ejercicio completado!
      </h3>
      <p id="modal-felicitaciones-texto" class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 mb-6 leading-relaxed">
        Has resuelto correctamente todos los pasos de este problema.
      </p>
      <div class="flex items-center justify-center gap-2.5">
        <button 
          onclick="cerrarModalFelicitaciones()" 
          class="px-3.5 py-2 text-xs font-mono rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        >
          Quedarme aquí
        </button>
        <button 
          id="btn-modal-siguiente-ejercicio"
          onclick="avanzarDesdeModalFelicitaciones()" 
          class="px-4 py-2 text-xs font-mono font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition-colors flex items-center gap-1.5 shadow-sm"
        >
          <span>Siguiente ejercicio</span>
          <span>→</span>
        </button>
      </div>
    </div>
  </div>



  <!-- Scripts -->
  <script src="materias.js"></script>
  <script src="ejercicios.js"></script>
  <script src="ejercicios_tc3.js"></script>
  <script src="ejercicios_ea1.js"></script>
  <script src="ejercicios_e2.js"></script>
  <script src="app.js"></script>
</body>
</html>
